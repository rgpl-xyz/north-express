# The North Express: https://north-express.app.rgpl.xyz
#
# Static Angular build. deploy/deploy.sh publishes each release to
# /var/www/north-express/releases/<commit> and points /var/www/north-express/current at it.
# Installed as /etc/nginx/sites-available/north-express; `certbot --nginx --redirect`
# then adds the TLS listeners and the HTTP-to-HTTPS redirect (see deploy/README.md).
# CI mounts this file as conf.d/default.conf in nginx:1.28-alpine to run the e2e tests
# against the build.

# Hashed bundles and fonts never change; index.html must be revalidated so a new release shows up.
map $uri $north_express_cache_control {
    ~*\.(?:js|css|woff2?)$ "public, max-age=31536000, immutable";
    default                "no-cache";
}

server {
    server_name north-express.app.rgpl.xyz;
    listen 80;
    listen [::]:80;

    root /var/www/north-express/current;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Kept at server level only: nginx drops every inherited add_header in a
    # location that declares its own. connect-src allows Fintraffic's Digitraffic
    # API, the only service the app calls.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://rata.digitraffic.fi; manifest-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control $north_express_cache_control always;

    # Routes the Angular router knows (src/app/app.routes.ts): the app, with 200.
    location ~ ^/(?:home|departures(?:/trains)?)?$ {
        try_files /index.html =404;
    }

    # Built files as-is. Anything else gets the app with a 404 status, so the
    # router renders its not-found page and crawlers still see a 404.
    location / {
        try_files $uri @previous;
    }
    error_page 404 /index.html;

    # A tab opened before the latest deploy still requests the old build's hashed
    # chunks for lazy routes; serve them from the previous release so it keeps working.
    location @previous {
        root /var/www/north-express/previous;
        try_files $uri =404;
    }
}
