# The North Express: https://north-express.app.rgpl.xyz
#
# Static Angular build. deploy/deploy.sh publishes each release to
# /var/www/north-express/releases/<commit> and points /var/www/north-express/current at it.
# Installed as /etc/nginx/sites-available/north-express; `certbot --nginx --redirect`
# then adds the TLS listeners and the HTTP-to-HTTPS redirect (see deploy/README.md).
# CI mounts this file as conf.d/default.conf in nginx:1.28-alpine to run the e2e tests
# against the build.

# Hashed bundles and fonts never change; the pages must be revalidated so a new release shows up.
map $uri $north_express_cache_control {
    ~*\.(?:js|css|woff2?)$ "public, max-age=31536000, immutable";
    default                "no-cache";
}

# Bus data is from Digitransit, whose API needs a key. nginx adds the key and sends fixed
# GraphQL queries (location /api/buses/ below), so the key never reaches a browser and
# the proxy answers nothing else. Answers are cached, so many viewers cost Digitransit
# one request: the station list for five minutes, a station's departures for 30 seconds.
# Each IP address may make 60 requests a minute, in bursts of up to 20, and all of them
# together 5 a second, as IPv6 addresses are easy to come by.
proxy_cache_path /var/cache/north-express-buses keys_zone=north_express_bus_cache:1m
                 max_size=50m inactive=1d use_temp_path=off;
limit_req_zone $binary_remote_addr zone=north_express_bus_requests:1m rate=60r/m;
limit_req_zone $server_name zone=north_express_bus_total:1m rate=5r/s;

# Slow or piled-up requests from one address can't tie the site up: at most 32 requests
# in progress per IP, and a client that stops sending a body or reading an answer for
# 10 seconds is dropped. The header timeout is set for every site on the server in
# /etc/nginx/conf.d/timeouts.conf, because nginx reads headers before it knows the site.
limit_conn_zone $binary_remote_addr zone=north_express_connections:1m;

server {
    server_name north-express.app.rgpl.xyz;
    listen 80;
    listen [::]:80;

    root /var/www/north-express/current;
    server_tokens off;
    charset utf-8;

    limit_conn north_express_connections 32;
    limit_conn_status 429;
    client_body_timeout 10s;
    send_timeout 10s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Kept at server level only: nginx drops every inherited add_header in a
    # location that declares its own. connect-src allows Fintraffic's Digitraffic
    # API; bus data comes from this server, under /api/buses.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://rata.digitraffic.fi; manifest-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Location only for this site itself, for the Nearest station button.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control $north_express_cache_control always;

    # Routes the Angular router knows (src/app/app.routes.ts), with 200. The home page is
    # rendered at build time (src/app/app.routes.server.ts), so its text is in the HTML; the
    # boards start from the empty shell and draw in the browser. The root goes to the home
    # page here, as the router would, so a crawler that runs no scripts gets there too.
    # Releases built before the home page was rendered have only /index.html, the whole
    # app; it is the fallback, so rolling back to one still works with this file.
    location = / {
        # Relative, so it keeps whatever host and port the request came in on.
        absolute_redirect off;
        return 301 /home$is_args$args;
    }
    location = /home {
        try_files /home/index.html /index.html =404;
    }
    location ~ ^/departures(?:/(?:trains|buses))?$ {
        try_files /index.csr.html /index.html =404;
    }

    # In a variable, so nginx looks Digitransit up when a request needs it (with the
    # resolver below) rather than at start, where a DNS failure would stop every site.
    set $north_express_digitransit https://api.digitransit.fi/routing/v2/finland/gtfs/v1;

    # Bus data (see the top of this file): GET only, and only the two addresses inside.
    location /api/buses/ {
        limit_req zone=north_express_bus_requests burst=20 nodelay;
        limit_req zone=north_express_bus_total burst=50 nodelay;
        limit_req_status 429;

        # The viewer's headers and cookies stay here; Digitransit gets these and the query.
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_method POST;
        proxy_http_version 1.1;
        proxy_set_header Content-Type application/graphql;
        proxy_set_header Accept application/json;
        proxy_set_header User-Agent north-express.app.rgpl.xyz;
        # The key, as `proxy_set_header digitransit-subscription-key "...";`, written by
        # deploy/set-digitransit-key: root-only and outside the repo. A glob, so nginx
        # still starts without the file, as in CI; Digitransit then answers 401.
        include /etc/nginx/secrets/digitransit-key*.conf;

        resolver 127.0.0.53 valid=300s;
        resolver_timeout 5s;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        # The request carries the key, so the certificate must be Digitransit's.
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        proxy_cache north_express_bus_cache;
        proxy_cache_lock on;
        # Otherwise a HEAD goes to Digitransit as a GET, which it doesn't answer.
        proxy_cache_convert_head off;
        # Digitransit varies by Accept-Language, which would keep a copy per language,
        # and sets Cloudflare cookies, which would stop caching. Neither matters here.
        proxy_ignore_headers Vary Set-Cookie Cache-Control Expires;
        proxy_hide_header Vary;
        proxy_hide_header Set-Cookie;

        location = /api/buses/stations {
            limit_except GET {
                deny all;
            }
            proxy_cache_key north-express-bus-stations;
            # Not long, because a GraphQL error comes with a 200 too. While a new list
            # loads, or Digitransit is down, the last one is served.
            proxy_cache_valid 200 5m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_set_body '{ stations { gtfsId name sv: name(language: "sv") vehicleMode lat lon } }';
            proxy_pass $north_express_digitransit;
        }

        # The id goes into the query as it is, so only ids written as Digitransit writes
        # them get through (STATION_ID in src/app/features/departures/data/digitransit-wire.ts).
        location = /api/buses/departures {
            limit_except GET {
                deny all;
            }
            if ($arg_id !~ "^[A-Za-z0-9_:.-]{1,60}$") {
                return 400;
            }
            proxy_cache_key north-express-bus-departures:$arg_id;
            proxy_cache_valid 200 30s;
            proxy_set_body '{ station(id: "$arg_id") { stoptimesWithoutPatterns(numberOfDepartures: 20, omitNonPickups: true, omitCanceled: false) { stop { gtfsId platformCode } serviceDay scheduledDeparture realtimeDeparture realtime realtimeState headsign trip { gtfsId arrivalStoptime { scheduledArrival stop { gtfsId name lat lon parentStation { gtfsId } } } route { shortName agency { name } } } } } }';
            proxy_pass $north_express_digitransit;
        }

        return 404;
    }

    # Built files as-is. Anything else gets the app with a 404 status, so the
    # router renders its not-found page and crawlers still see a 404.
    location / {
        try_files $uri @previous;
    }
    error_page 404 @not_found;
    location @not_found {
        try_files /index.csr.html /index.html =404;
    }

    # A tab opened before the latest deploy still requests the old build's hashed
    # chunks for lazy routes; serve them from the previous release so it keeps working.
    location @previous {
        root /var/www/north-express/previous;
        try_files $uri =404;
    }
}
