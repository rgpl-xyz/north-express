<div class="sign-band">
  <div class="container">
    <app-track-line
      class="sign-band-art d-none d-xl-block"
      [named]="false"
      [road]="kind.mode === 'bus'"
      ends="stations"
    />
    <!-- The mode first, as on Finnish wayfinding signs: a pictogram plate, then the board's name. -->
    <h1 class="board-mode">
      <span class="mode-plate"><app-mode-pictogram [mode]="kind.mode" /></span>
      {{ kind.heading }}
    </h1>
    <div class="row g-3 align-items-end">
      <div class="col-12 col-md-8 col-lg-6">
        <app-station-picker
          #picker
          [stations]="stations()"
          [placeholder]="board.stationPrompt()"
          [selected]="selectedCode()"
          (selectedChange)="showStation($event)"
        />
      </div>
      <div class="col-12 col-md-auto d-flex flex-wrap gap-2">
        <button
          #refreshButton
          type="button"
          class="btn btn-primary"
          [disabled]="!canRefresh()"
          (click)="board.refresh()"
        >
          Refresh
        </button>
        <app-nearest-station
          #nearest
          [stations]="stations()"
          [selected]="selectedCode()"
          (picked)="showStation($event)"
        />
      </div>
    </div>
  </div>
  <!--
    In a container of its own, so the drawing above keeps its place when a message shows.
    Always rendered so screen readers hear each change; out of sight until it says something.
  -->
  <div class="container">
    <p
      class="small mt-2 mb-0"
      role="status"
      [class.visually-hidden]="!nearest.message()"
      [class.fw-semibold]="nearest.failed()"
    >
      {{ nearest.message() }}
    </p>
  </div>
</div>

<div class="container py-4">
  <!-- The live region below announces the same text, so this box has no role of its own. -->
  @if (board.alert(); as alert) {
    <div class="alert alert-notice d-flex flex-wrap align-items-center gap-3 mb-3">
      <span>{{ alert.text }}</span>
      <!-- aria-disabled, not disabled: a disabled button would lose keyboard focus. -->
      <button
        type="button"
        class="btn btn-sm btn-primary"
        [class.disabled]="alert.busy"
        [attr.aria-disabled]="alert.busy ? 'true' : null"
        (click)="tryAgain(alert, picker, refreshButton)"
      >
        {{ alert.busy ? 'Trying again…' : 'Try again' }}
      </button>
    </div>
  }

  <!-- Always rendered so screen readers hear every change; hidden when the grid or alert says it. -->
  <p class="board-status" role="status" [class.visually-hidden]="!board.status().visible">
    {{ board.status().text }}
  </p>

  <!-- No empty board: until there are departures (or some are loading), the message above says why. -->
  @if (showBoard()) {
    <p class="small text-body-secondary mb-2">
      Times are Finland local time.
      @if (board.lastUpdated(); as lastUpdated) {
        <span>{{ lastUpdated }}</span>
      }
    </p>
    <app-departure-grid [rows]="rows()" [loading]="loading()" />
  }
</div>
