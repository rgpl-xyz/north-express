<div class="sign-band">
  <div class="container">
    <app-track-line class="sign-band-art d-none d-xl-block" [named]="false" ends="stations" />
    <h1 class="visually-hidden">{{ kind.heading }}</h1>
    <div class="row g-3 align-items-center">
      <div class="col-12 col-md-8 col-lg-6">
        <app-station-picker
          #picker
          [stations]="stations()"
          [placeholder]="board.stationPrompt()"
          [selected]="selectedCode()"
          (selectedChange)="showStation($event)"
        />
      </div>
      <div class="col-12 col-md-auto">
        <button
          #refreshButton
          type="button"
          class="btn btn-primary"
          [disabled]="!canRefresh()"
          (click)="board.refresh()"
        >
          Refresh
        </button>
      </div>
    </div>
  </div>
</div>

<div class="container py-4">
  <!-- The live region below announces the same text, so this box has no role of its own. -->
  @if (board.alert(); as alert) {
    <div class="alert alert-notice d-flex flex-wrap align-items-center gap-3 mb-3">
      <span>{{ alert.text }}</span>
      <!-- aria-disabled, not disabled: a disabled button would lose keyboard focus. -->
      <button
        type="button"
        class="btn btn-sm btn-primary"
        [class.disabled]="alert.busy"
        [attr.aria-disabled]="alert.busy ? 'true' : null"
        (click)="tryAgain(alert, picker, refreshButton)"
      >
        {{ alert.busy ? 'Trying again…' : 'Try again' }}
      </button>
    </div>
  }

  <!-- Always rendered so screen readers hear every change; hidden when the grid or alert says it. -->
  <p role="status" [class.visually-hidden]="!board.status().visible">{{ board.status().text }}</p>

  <!-- No empty board: until there are departures (or some are loading), the message above says why. -->
  @if (showBoard()) {
    <p class="small text-body-secondary mb-2">
      Times are Finland local time.
      @if (board.lastUpdated(); as lastUpdated) {
        <span>{{ lastUpdated }}</span>
      }
    </p>
    <app-departure-grid [rows]="rows()" [loading]="loading()" />
  }
</div>
