<!-- No button where the browser has no location service; the search works as before. -->
@if (geolocation) {
  <!-- aria-disabled while locating, not disabled: a disabled button would lose keyboard focus. -->
  <button
    type="button"
    class="btn btn-outline-light"
    [disabled]="stations().length === 0"
    [class.disabled]="locating()"
    [attr.aria-disabled]="locating() ? 'true' : null"
    (click)="locate()"
  >
    <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
      <circle cx="8" cy="8" r="3.5" />
      <path d="M8 1v3M8 12v3M1 8h3M12 8h3" />
    </svg>
    {{ locating() ? 'Locating…' : 'Nearest station' }}
  </button>
}
