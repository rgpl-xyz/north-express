<section class="sign-band not-found-band" aria-labelledby="not-found-title">
  <div class="container">
    <app-track-line class="sign-band-art d-none d-xl-block" [named]="false" ends="buffer" />
    <h1 id="not-found-title" class="sign-title">Page not found</h1>
    <p class="lead my-4">The page you were looking for may have moved or been renamed.</p>
    <a class="btn btn-primary" routerLink="/">Take me home</a>
  </div>
</section>
