<section id="welcome" class="sign-band home-band" aria-labelledby="welcome-title">
  <div class="container">
    <div class="row align-items-center gy-4">
      <div class="col-12 col-lg-6">
        <h1 id="welcome-title" class="sign-title">Welcome, traveller</h1>
        <p class="lead my-4">
          Live train and bus departures in Finland. Pick a station to see what leaves next, where to
          board and whether it is on time.
        </p>
        <div class="d-grid d-sm-flex gap-3">
          <a class="btn btn-primary btn-lg" routerLink="/departures/trains">See train departures</a>
          <a class="btn btn-outline-light btn-lg" routerLink="/departures/buses"
            >See bus departures</a
          >
        </div>
      </div>
      <div class="col-12 col-lg-6">
        <app-track-line />
      </div>
    </div>
  </div>
</section>

<section id="help" class="container py-5" aria-labelledby="help-title">
  <h2 id="help-title" class="h3">Questions or bugs?</h2>
  <p class="mb-0">
    Open an issue on <a [href]="repositoryUrl">GitHub</a> or email
    <a [href]="'mailto:' + contactEmail">{{ contactEmail }}</a
    >.
  </p>
</section>
