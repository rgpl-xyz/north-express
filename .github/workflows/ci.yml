name: CI

# Tests and builds every push, then runs the e2e tests against that build served by the
# production nginx config. The app is served from the rgpl VPS (a *.app.rgpl.xyz
# subdomain); deploys are manual: see deploy/README.md.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Test
        run: npx ng test --watch=false

      - name: Build
        run: npx ng build

      - name: Serve the build with the production nginx config
        run: |
          docker run --detach --name north-express --publish 8080:80 \
            --volume "$PWD/deploy/nginx/north-express.conf:/etc/nginx/conf.d/default.conf:ro" \
            --volume "$PWD/dist/north-express/browser:/var/www/north-express/current:ro" \
            docker.io/library/nginx:1.28-alpine

      # nginx starts while this runs. Headless runs only need the headless shell.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps --only-shell chromium

      - name: e2e
        run: |
          curl --silent --show-error --fail --retry 10 --retry-all-errors --retry-delay 1 \
            --output /dev/null http://localhost:8080/
          npm run e2e
        env:
          E2E_BASE_URL: http://localhost:8080

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
